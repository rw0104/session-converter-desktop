[package]
name = "session-converter-desktop"
version = "0.1.9"
description = "Local-first desktop credential format converter"
authors = ["Session Converter contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "session_converter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"
uuid = { version = "1.24.0", features = ["v4"] }
