name: Release desktop bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin --bundles app
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --bundles app
            target: ""
          - platform: ubuntu-24.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Session Converter v__VERSION__
          releaseBody: |
            ## v0.1.9 紧急修复

            本次更新修复“实际模型检测”默认无法完成的问题。

            - 默认检测改为“自动匹配”，会读取每个账号实际可见的模型后再发起最小请求。
            - 修复默认硬编码 sol 时，部分账号只显示“不支持该模型”而没有真正执行检测的问题。
            - 仍可手动选择 sol 或输入其他模型名称。
            - 不改变账号转换结果、清理规则或本地隐私保护方式。

            建议所有 v0.1.8 及更早版本用户尽快升级。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
