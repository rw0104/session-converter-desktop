name: Release desktop bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin --bundles app
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --bundles app
            target: ""
          - platform: ubuntu-24.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Session Converter v__VERSION__
          releaseBody: |
            ## v0.1.12 CPA / Codex 兼容性更新

            适配 CLIProxyAPI v8 的套餐字段，并同步 Codex 模型检测协议。

            - CPA / Codex 账户转换保留 plan_type，缺失时从令牌补全，未提供套餐信息时按上游默认使用 free。
            - 模型列表查询对齐 codex_cli_rs/0.155.0；Responses 检测沿用上游 codex-tui/0.154.0，并补充实际模型的路由提示。
            - 复核 CLIProxyAPI a270e7b9 和 sub2api 42bc7f6c，更新四个 CPA 相关文件的审计记录。
            - 补充套餐字段与请求构造回归测试，覆盖双向转换和其他提供商的兼容性。

            提供 Windows、macOS（Apple Silicon / Intel）和 Linux 安装包，支持应用内签名更新。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
