name: Release desktop bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin --bundles app
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --bundles app
            target: ""
          - platform: ubuntu-24.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Session Converter v__VERSION__
          releaseBody: |
            ## v0.1.13 上游兼容性更新

            同步 CLIProxyAPI 与 sub2api 的 Codex 相关上游变化，并发布签名桌面安装包。

            - 保留 CLIProxyAPI 新增的 SIWC 凭据字段，双向转换不会丢失 `siwc` 与 `use_siwc`。
            - 模型目录探测对齐 CLIProxyAPI `codex_cli_rs/0.159.0` 客户端身份。
            - 复核 CLIProxyAPI `e7003d2a` 与 sub2api `b0a02a33` 的受审文件，并更新审计钉。
            - sub2api 服务端账号去重规则变化不影响本地格式转换；本版本不实现服务端索引逻辑。

            提供 Windows、macOS（Apple Silicon / Intel）和 Linux 安装包，支持应用内签名更新。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
