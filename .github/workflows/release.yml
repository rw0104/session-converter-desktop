name: Release desktop bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin --bundles app
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --bundles app
            target: ""
          - platform: ubuntu-24.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Session Converter v__VERSION__
          releaseBody: |
            ## v0.1.10 算法兼容性更新

            同步最新上游 Codex 检测协议，并复核 CPA / sub2api 转换规则。

            - 模型列表查询的 client_version、Version 请求头和 Codex 请求身份同步至 0.153.3。
            - User-Agent 对齐 CLIProxyAPI 当前默认值，继续支持自动匹配账号可用模型。
            - 复核 CLIProxyAPI c76dfd4e 和 sub2api ab99d56e；账号字段与 Agent Identity 规则保持兼容。
            - 新增模型列表和流式检测请求的离线回归测试。

            提供 Windows、macOS（Apple Silicon / Intel）和 Linux 安装包，支持应用内签名更新。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
